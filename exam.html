<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA — Đề thi tổng hợp</title>
    <meta name="description"
        content="Đề thi trắc nghiệm DSA: Complexity, Elementary Sorts, Stack, Queue, Priority Queue. Sinh đề mới ngẫu nhiên theo mã đề.">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0a0e1a;
            --card: #1a2035;
            --code: #0d1117;
            --text: #e8edf5;
            --muted: #8b95a8;
            --a1: #6366f1;
            --a2: #06b6d4;
            --ok: #10b981;
            --bad: #ef4444;
            --warn: #f59e0b;
            --border: rgba(99, 102, 241, .2);
            --r: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.65;
            min-height: 100vh;
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            width: 520px;
            height: 520px;
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
            filter: blur(30px);
        }

        body::before {
            background: radial-gradient(circle, rgba(99, 102, 241, .28), transparent 70%);
            top: -180px;
            left: -160px;
        }

        body::after {
            background: radial-gradient(circle, rgba(6, 182, 212, .22), transparent 70%);
            bottom: -160px;
            right: -140px;
        }

        .wrap {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 20px 80px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--a1), var(--a2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .sub {
            color: var(--muted);
            margin: 6px 0 26px;
        }

        .card {
            background: rgba(26, 32, 53, .85);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 24px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, .35);
        }

        .hidden {
            display: none !important;
        }

        label.f {
            display: block;
            font-size: .85rem;
            color: var(--muted);
            margin: 14px 0 6px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .05em;
        }

        input[type=number],
        input[type=text] {
            background: var(--code);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 9px 12px;
            font: inherit;
            width: 140px;
        }

        input[type=range] {
            width: 260px;
            accent-color: var(--a1);
            vertical-align: middle;
        }

        .topics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 10px;
        }

        .topic {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: .2s;
            background: rgba(13, 17, 23, .5);
        }

        .topic:hover {
            border-color: var(--a1);
            transform: translateY(-2px);
        }

        .topic:has(input:checked) {
            border-color: var(--a2);
            background: rgba(6, 182, 212, .1);
        }

        .topic input {
            accent-color: var(--a2);
            width: 17px;
            height: 17px;
        }

        .topic small {
            display: block;
            color: var(--muted);
            font-size: .75rem;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            align-items: flex-end;
        }

        button {
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            border: 0;
            border-radius: 10px;
            padding: 11px 22px;
            color: #fff;
            background: linear-gradient(135deg, var(--a1), #4f46e5);
            transition: .2s;
            box-shadow: 0 4px 18px rgba(99, 102, 241, .35);
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.12);
        }

        button.sec {
            background: #243049;
            box-shadow: none;
        }

        button.ok {
            background: linear-gradient(135deg, var(--ok), #059669);
            box-shadow: 0 4px 18px rgba(16, 185, 129, .3);
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 26px;
        }

        .bar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 12px 18px;
            margin-bottom: 18px;
            background: rgba(10, 14, 26, .92);
            border: 1px solid var(--border);
            border-radius: 12px;
            backdrop-filter: blur(12px);
        }

        .timer {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--a2);
        }

        .timer.low {
            color: var(--bad);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            50% {
                opacity: .45;
            }
        }

        .badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: .8rem;
            padding: 3px 10px;
            border-radius: 99px;
            background: rgba(99, 102, 241, .18);
            border: 1px solid var(--border);
            color: #c7d2fe;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 190px;
            gap: 18px;
            align-items: start;
        }

        .nav {
            position: sticky;
            top: 84px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .nav a {
            text-align: center;
            padding: 6px 0;
            font-size: .8rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            color: var(--muted);
            text-decoration: none;
        }

        .nav a.done {
            background: rgba(99, 102, 241, .3);
            color: #fff;
        }

        .nav a.right {
            background: rgba(16, 185, 129, .3);
            color: #fff;
        }

        .nav a.wrong {
            background: rgba(239, 68, 68, .3);
            color: #fff;
        }

        .q {
            margin-bottom: 18px;
            position: relative;
            overflow: hidden;
        }

        .q::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--a1);
        }

        .q.right::before {
            background: var(--ok);
        }

        .q.wrong::before {
            background: var(--bad);
        }

        .qh {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .qn {
            font-weight: 800;
            color: var(--a2);
        }

        .qt {
            white-space: pre-wrap;
            margin-bottom: 10px;
        }

        pre {
            background: var(--code);
            border: 1px solid rgba(255, 255, 255, .06);
            border-radius: 10px;
            padding: 14px 16px;
            font: .85rem/1.55 'JetBrains Mono', monospace;
            overflow-x: auto;
            margin-bottom: 12px;
            color: #c9d1d9;
        }

        .opt {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            padding: 10px 14px;
            margin: 7px 0;
            border: 1px solid rgba(255, 255, 255, .07);
            border-radius: 10px;
            cursor: pointer;
            transition: .15s;
            background: rgba(13, 17, 23, .4);
        }

        .opt:hover {
            border-color: var(--a1);
            background: rgba(99, 102, 241, .1);
        }

        .opt.sel {
            border-color: var(--a1);
            background: rgba(99, 102, 241, .2);
        }

        .opt.c {
            border-color: var(--ok);
            background: rgba(16, 185, 129, .16);
        }

        .opt.w {
            border-color: var(--bad);
            background: rgba(239, 68, 68, .16);
        }

        .exam-done .opt {
            cursor: default;
        }

        .opt b {
            font-family: 'JetBrains Mono', monospace;
            color: var(--a2);
            min-width: 18px;
        }

        .opt span {
            font-family: 'JetBrains Mono', monospace;
            font-size: .9rem;
            white-space: pre-wrap;
        }

        .exp {
            margin-top: 10px;
            padding: 10px 14px;
            border-radius: 8px;
            background: rgba(245, 158, 11, .1);
            border: 1px solid rgba(245, 158, 11, .3);
            font-size: .9rem;
            white-space: pre-wrap;
        }

        .score {
            text-align: center;
            padding: 28px;
            margin-bottom: 20px;
        }

        .score .big {
            font-size: 3.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--ok), var(--a2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        textarea {
            width: 100%;
            min-height: 130px;
            resize: vertical;
            background: var(--code);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            font: .88rem/1.55 'JetBrains Mono', monospace;
        }

        textarea:focus {
            outline: 0;
            border-color: var(--a2);
        }

        .ref {
            margin-top: 10px;
            padding: 12px 14px;
            border-radius: 8px;
            background: rgba(16, 185, 129, .1);
            border: 1px solid rgba(16, 185, 129, .35);
            font-size: .9rem;
            white-space: pre-wrap;
        }

        .nav a.essay {
            border-color: rgba(245, 158, 11, .4);
        }

        .tag {
            font-size: .7rem;
            padding: 2px 8px;
            border-radius: 99px;
            background: rgba(6, 182, 212, .15);
            color: #67e8f9;
        }

        .tag.gen {
            background: rgba(245, 158, 11, .15);
            color: #fcd34d;
        }

        @media (max-width: 800px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .nav {
                display: none;
            }
        }

        @media print {
            body {
                background: #fff;
                color: #000;
            }

            body::before,
            body::after,
            .bar,
            .nav,
            .actions,
            .exp {
                display: none !important;
            }

            .card {
                background: #fff;
                border: 1px solid #999;
                box-shadow: none;
                color: #000;
                break-inside: avoid;
            }

            pre {
                background: #f4f4f4;
                color: #000;
            }

            .opt {
                border-color: #bbb;
                background: #fff;
            }

            .layout {
                display: block;
            }

            h1 {
                color: #000;
                -webkit-text-fill-color: #000;
            }
        }
    </style>
</head>

<body>
    <div class="wrap" style="left: 71px; top: -7px;">
        <h1>DSA — Đề thi tổng hợp</h1>
        <p class="sub">Complexity · Elementary Sorts · Stack · Queue · Priority Queue — mỗi mã đề sinh ra một đề khác
            nhau.</p>

        <!-- SETUP -->
        <section id="setup" class="card">
            <label class="f">Chủ đề</label>
            <div class="topics" id="topicList"></div>
            <div class="row">
                <div><label class="f" for="numQ">Số câu trắc nghiệm</label><input type="number" id="numQ" min="0"
                        max="100" value="30"></div>
                <div><label class="f" for="numE">Số câu tự luận</label><input type="number" id="numE" min="0" max="30"
                        value="3"></div>
                <div><label class="f" for="mins">Thời gian (phút)</label><input type="number" id="mins" min="0"
                        max="180" value="30"></div>
                <div><label class="f" for="seed">Mã đề</label><input type="text" id="seed"></div>
                <div><label class="f" for="genPct">Tỉ lệ câu sinh tự động: <span id="genPctV">50</span>%</label><input
                        type="range" id="genPct" min="0" max="100" value="50"></div>
            </div>
            <p class="sub" style="margin:14px 0 0">Cùng mã đề + cùng cấu hình ⇒ cùng một đề. Thời gian = 0 là không giới
                hạn.</p>
            <div class="actions">
                <button id="startBtn">▶ Bắt đầu thi</button>
                <button class="sec" id="rollBtn">🎲 Đổi mã đề</button>
            </div>
        </section>

        <!-- HISTORY -->
        <section id="history" class="card" style="margin-top:20px">
            <div class="qh">
                <h2 style="font-size:1.2rem">📊 Lịch sử kết quả</h2>
                <button class="sec" id="exportBtn" style="padding:6px 14px">⬇ Xuất JSON</button>
                <button class="sec" id="clearBtn" style="padding:6px 14px">🗑 Xoá hết</button>
            </div>
            <div id="historyList"></div>
        </section>

        <!-- EXAM -->
        <section id="exam" class="hidden">
            <div class="bar">
                <div style="display:flex;gap:8px;align-items:center"><button class="sec" id="homeBtn"
                        style="padding:6px 14px">🏠 Trang chính</button><span class="badge" id="examCode"></span> <span
                        class="badge" id="progress"></span></div>
                <div class="timer" id="timer">--:--</div>
                <div style="display:flex;gap:8px"><button class="sec" id="printBtn">🖨 In đề</button><button
                        class="ok hidden" id="saveTopBtn">💾 Lưu kết quả</button><button class="ok" id="submitBtn">Nộp
                        bài</button></div>
            </div>
            <div id="resultBox"></div>
            <div class="layout">
                <div id="qList"></div>
                <nav class="nav" id="nav"></nav>
            </div>
            <div class="actions hidden" id="afterActions">
                <button class="ok" id="saveBtn">💾 Lưu kết quả</button>
                <button id="newBtn">🎲 Đề mới (mã mới)</button>
                <button class="sec" id="retryBtn">↻ Làm lại đề này</button>
                <button class="sec" id="backBtn">⚙ Cấu hình</button>
            </div>
        </section>
    </div>

    <script>
        /* =====================================================================
           NGÂN HÀNG CÂU HỎI TĨNH — muốn thêm câu mới, chỉ cần thêm 1 dòng S(...)
           S(chủ_đề, câu_hỏi, [4 đáp án], chỉ_số_đúng(0-3), giải_thích, code_tuỳ_chọn)
           Chủ đề: cx | sort | stack | queue | pq
           ===================================================================== */
        const TOPICS = {
            cx: { name: 'Complexity', desc: 'Big-O, Omega, Theta' },
            sort: { name: 'Elementary Sorts', desc: 'Selection, Insertion, Merge, Quick' },
            stack: { name: 'Stack', desc: 'LIFO, postfix, ứng dụng' },
            queue: { name: 'Queue', desc: 'FIFO, circular, BFS' },
            pq: { name: 'Priority Queue', desc: 'Binary heap, swim/sink' }
        };
        const BANK = [];
        const S = (t, q, o, c, e, code) => BANK.push({ topic: t, q, opts: o, correct: c, exp: e || '', code: code || '' });

        /* ---- Complexity ---- */
        S('cx', 'Độ phức tạp trường hợp xấu nhất của tìm kiếm tuần tự (linear search) trên n phần tử là?', ['O(1)', 'O(log n)', 'O(n)', 'O(n²)'], 2, 'Phải duyệt hết n phần tử trong trường hợp xấu nhất.');
        S('cx', 'Binary search có độ phức tạp và yêu cầu gì?', ['O(log n), mảng đã sắp xếp', 'O(n), mảng bất kỳ', 'O(log n), mảng bất kỳ', 'O(n log n), mảng đã sắp xếp'], 0, 'Mỗi bước loại một nửa → O(log n), nhưng phải sắp xếp trước.');
        S('cx', 'O(n² + n) được rút gọn thành?', ['O(n)', 'O(n²)', 'O(n³)', 'O(2n)'], 1, 'Giữ lại số hạng bậc cao nhất, bỏ hằng số.');
        S('cx', 'Thứ tự tăng dần đúng của tốc độ tăng trưởng là?', ['O(n) < O(log n) < O(n²) < O(2ⁿ)', 'O(log n) < O(n) < O(n log n) < O(n²) < O(2ⁿ)', 'O(1) < O(n) < O(log n) < O(n²)', 'O(log n) < O(n²) < O(n log n) < O(2ⁿ)'], 1, 'O(1) < log n < n < n log n < n² < n³ < 2ⁿ.');
        S('cx', 'Hàm T(n) = 3n + 5 thuộc lớp nào?', ['O(1)', 'O(n)', 'O(n²)', 'O(log n)'], 1, 'Bỏ hằng số nhân và hằng số cộng.');
        S('cx', 'Thuật toán O(n²). Nếu kích thước đầu vào tăng gấp đôi thì thời gian chạy xấp xỉ?', ['Gấp đôi', 'Gấp 3', 'Gấp 4', 'Không đổi'], 2, '(2n)² = 4n².');
        S('cx', 'Ký hiệu Big-Omega Ω(g(n)) mô tả?', ['Chặn trên', 'Chặn dưới', 'Chặn chặt (cả trên lẫn dưới)', 'Trung bình'], 1, 'Ω là chặn dưới (tốc độ tăng trưởng ít nhất).');
        S('cx', 'Ký hiệu Big-Theta Θ(g(n)) mô tả?', ['Chặn trên', 'Chặn dưới', 'Chặn chặt: vừa là O vừa là Ω', 'Trường hợp tốt nhất'], 2, 'Θ = O ∩ Ω.');
        S('cx', 'Đoạn code sau có độ phức tạp?', ['O(1)', 'O(n)', 'O(n²)', 'O(log n)'], 1, 'Vòng for chạy n lần, thân vòng O(1).', 'int s = 0;\nfor (int i = 0; i < n; i++)\n    s += i;');
        S('cx', 'Tại sao khi phân tích Big-O ta bỏ qua các hằng số?', ['Vì hằng số luôn bằng 0', 'Vì ta quan tâm tốc độ tăng khi n rất lớn', 'Vì máy tính xử lý hằng số miễn phí', 'Vì Big-O chỉ áp dụng cho vòng lặp'], 1, 'Big-O mô tả xu hướng tăng tiệm cận.');

        /* ---- Elementary Sorts ---- */
        S('sort', 'Số lần so sánh của Selection Sort trên mảng n phần tử xấp xỉ?', ['n', 'n log n', 'n²/2 (không phụ thuộc đầu vào)', 'n²/4'], 2, 'Luôn so sánh (n-1)+(n-2)+…+1 ≈ n²/2.');
        S('sort', 'Số lần hoán đổi tối đa của Selection Sort là?', ['n² /2', 'n', 'log n', 'n log n'], 1, 'Mỗi lượt chỉ hoán đổi 1 lần → tối đa n-1 lần.');
        S('sort', 'Trường hợp tốt nhất của Insertion Sort (mảng đã sắp xếp) có độ phức tạp?', ['O(1)', 'O(n)', 'O(n log n)', 'O(n²)'], 1, 'Mỗi phần tử chỉ so sánh 1 lần với phần tử trước nó.');
        S('sort', 'Trường hợp xấu nhất của Insertion Sort xảy ra khi mảng ban đầu như thế nào?', ['Đã sắp xếp tăng dần', 'Sắp xếp giảm dần', 'Toàn phần tử bằng nhau', 'Có đúng 1 phần tử'], 1, 'Mảng đảo ngược → ~n²/2 so sánh và hoán đổi.');
        S('sort', 'Cặp thuật toán nào sau đây là ổn định (stable)?', ['Selection Sort, Quick Sort', 'Insertion Sort, Merge Sort', 'Selection Sort, Merge Sort', 'Quick Sort, Heap Sort'], 1, 'Insertion & Merge ổn định; Selection & Quick (cơ bản) không.');
        S('sort', 'Selection Sort không ổn định vì?', ['Nó dùng đệ quy', 'Hoán đổi có thể nhảy qua các phần tử bằng nhau', 'Nó cần bộ nhớ phụ', 'Nó so sánh quá nhiều'], 1, 'Ví dụ [2a, 2b, 1]: hoán đổi 2a với 1 làm 2a đứng sau 2b.');
        S('sort', 'Mergesort có thời gian và bộ nhớ phụ là?', ['O(n log n) và O(1)', 'O(n log n) và O(n)', 'O(n²) và O(n)', 'O(n) và O(log n)'], 1, 'Cần mảng phụ kích thước n để trộn.');
        S('sort', 'Quicksort có độ phức tạp xấu nhất là bao nhiêu và cách tránh?', ['O(n log n); không cần tránh', 'O(n²); xáo trộn mảng ngẫu nhiên trước khi sort', 'O(n²); dùng mảng phụ', 'O(n); chọn pivot lớn nhất'], 1, 'Pivot xấu liên tục → n²; shuffle làm xác suất đó cực nhỏ.');
        S('sort', 'Insertion Sort hoạt động tốt nhất với loại dữ liệu nào?', ['Mảng ngẫu nhiên rất lớn', 'Mảng gần như đã sắp xếp', 'Mảng đảo ngược', 'Mảng toàn phần tử khác nhau'], 1, 'Số lần hoán đổi = số nghịch thế (inversions), ít nghịch thế → nhanh.');

        /* =====================================================================
           BỘ SINH CÂU HỎI THAM SỐ HOÁ — mỗi hàm nhận rng() và trả về câu hỏi
           ===================================================================== */
        function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
        function hashSeed(s) { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
        const ri = (r, a, b) => a + Math.floor(r() * (b - a + 1));
        function shuffle(r, arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; }
        function pickDistinct(r, n, lo, hi) { return shuffle(r, Array.from({ length: hi - lo + 1 }, (_, i) => lo + i)).slice(0, n); }

        /* dựng 4 đáp án: correct + distractors (loại trùng) + filler nếu thiếu */
        function mk(r, correct, distractors, filler) {
            const set = [correct];
            for (const d of distractors) if (!set.includes(d)) set.push(d);
            let guard = 0;
            while (set.length < 4 && guard++ < 200) { const f = filler(); if (!set.includes(f)) set.push(f); }
            const opts = shuffle(r, set.slice(0, 4).includes(correct) ? set.slice(0, 4) : [correct, ...set.slice(1, 4)]);
            return { opts, correct: opts.indexOf(correct) };
        }
        const L = a => a.join(', ');

        function genStack(r) {
            const stack = [], ops = [], pops = [], pushed = [];
            let cnt = 0, target = ri(r, 7, 9);
            while (ops.length < target || pops.length < 2) {
                if (stack.length && (r() < .42 || ops.length >= target + 4)) { pops.push(stack.pop()); ops.push('pop()'); }
                else { const v = ri(r, 1, 9); stack.push(v); pushed.push(v); ops.push('push(' + v + ')'); }
                if (++cnt > 30) break;
            }
            const fifo = []; { const q = []; for (const o of ops) { if (o[1] === 'u') q.push(+o.slice(5, -1)); else fifo.push(q.shift()); } }
            const m = mk(r, L(pops), [L(fifo), L(pops.slice().reverse()), L(stack.slice().reverse())],
                () => L(shuffle(r, pushed).slice(0, pops.length)));
            return { topic: 'stack', q: 'Thực hiện lần lượt các thao tác trên một Stack rỗng. Dãy giá trị trả về bởi các lần pop() theo thứ tự là?', code: ops.join('\n'), opts: m.opts, correct: m.correct, exp: 'Stack là LIFO → pop lấy phần tử vừa push gần nhất.\nKết quả: ' + L(pops) };
        }
        function genQueue(r) {
            const q = [], ops = [], outs = [], pushed = [];
            let cnt = 0, target = ri(r, 7, 9);
            while (ops.length < target || outs.length < 2) {
                if (q.length && (r() < .42 || ops.length >= target + 4)) { outs.push(q.shift()); ops.push('dequeue()'); }
                else { const v = ri(r, 1, 9); q.push(v); pushed.push(v); ops.push('enqueue(' + v + ')'); }
                if (++cnt > 30) break;
            }
            const lifo = []; { const s = []; for (const o of ops) { if (o[0] === 'e') s.push(+o.slice(8, -1)); else lifo.push(s.pop()); } }
            const m = mk(r, L(outs), [L(lifo), L(outs.slice().reverse()), L(q.slice().reverse())],
                () => L(shuffle(r, pushed).slice(0, outs.length)));
            return { topic: 'queue', q: 'Thực hiện lần lượt các thao tác trên một Queue rỗng. Dãy giá trị trả về bởi các lần dequeue() theo thứ tự là?', code: ops.join('\n'), opts: m.opts, correct: m.correct, exp: 'Queue là FIFO → dequeue lấy phần tử vào sớm nhất.\nKết quả: ' + L(outs) };
        }
        function genPostfix(r) {
            const [a, b, c] = [ri(r, 1, 9), ri(r, 1, 9), ri(r, 1, 9)];
            const o1 = '+-*'[ri(r, 0, 2)], o2 = '+-*'[ri(r, 0, 2)];
            const ev = (x, o, y) => o === '+' ? x + y : o === '-' ? x - y : x * y;
            let expr, val, wrong;
            if (r() < .5) { expr = `${a} ${b} ${o1} ${c} ${o2}`; val = ev(ev(a, o1, b), o2, c); wrong = ev(a, o1, ev(b, o2, c)); }
            else { expr = `${a} ${b} ${c} ${o1} ${o2}`; val = ev(a, o2, ev(b, o1, c)); wrong = ev(ev(a, o2, b), o1, c); }
            const m = mk(r, String(val), [String(wrong), String(val + 1), String(val - 1), String(-val)], () => String(ri(r, -20, 60)));
            return { topic: 'stack', q: 'Dùng stack để tính biểu thức postfix sau. Kết quả là?', code: expr, opts: m.opts, correct: m.correct, exp: 'Gặp số → push; gặp toán tử → pop y, pop x, push (x op y).\nKết quả: ' + val };
        }
        function genSort(r) {
            const n = 6, arr = pickDistinct(r, n, 1, 30), k = ri(r, 2, 3), useIns = r() < .5;
            const ins = arr.slice(0, k + 1).sort((x, y) => x - y).concat(arr.slice(k + 1));
            const sel = arr.slice(); for (let i = 0; i < k; i++) { let mi = i; for (let j = i + 1; j < n; j++) if (sel[j] < sel[mi]) mi = j;[sel[i], sel[mi]] = [sel[mi], sel[i]]; }
            const good = useIns ? ins : sel, other = useIns ? sel : ins;
            const swapAdj = arr.slice();[swapAdj[0], swapAdj[1]] = [swapAdj[1], swapAdj[0]];
            const m = mk(r, '[' + L(good) + ']', ['[' + L(other) + ']', '[' + L(arr.slice().sort((x, y) => x - y)) + ']', '[' + L(swapAdj) + ']'], () => '[' + L(shuffle(r, arr)) + ']');
            const name = useIns ? 'Insertion Sort' : 'Selection Sort';
            const how = useIns ? `Sau ${k} lượt, ${k + 1} phần tử đầu đã được sắp xếp tăng dần.` : `Sau ${k} lượt, ${k} phần tử nhỏ nhất đã đứng đúng vị trí ở đầu mảng.`;
            return { topic: 'sort', q: `Cho mảng [${L(arr)}]. Trạng thái mảng sau khi ${name} thực hiện đúng ${k} lượt (i = ${useIns ? 1 : 0} … ${useIns ? k : k - 1}) là?`, code: '', opts: m.opts, correct: m.correct, exp: how + '\nKết quả: [' + L(good) + ']' };
        }
        function genInversions(r) {
            const arr = pickDistinct(r, 6, 1, 20);
            let inv = 0; for (let i = 0; i < arr.length; i++) for (let j = i + 1; j < arr.length; j++) if (arr[i] > arr[j]) inv++;
            const m = mk(r, String(inv), [String(inv + 1), String(inv + 2), String(Math.max(0, inv - 1)), '5', '15'], () => String(ri(r, 0, 15)));
            return { topic: 'sort', q: `Insertion Sort (dùng hoán đổi liền kề) sắp xếp mảng [${L(arr)}] thực hiện tổng cộng bao nhiêu lần hoán đổi?`, code: '', opts: m.opts, correct: m.correct, exp: 'Số lần hoán đổi = số nghịch thế (cặp i<j mà a[i] > a[j]) = ' + inv };
        }
        function genLoop(r) {
            const T = [
                ['int c = 0;\nfor (int i = 0; i < n; i++)\n    for (int j = 0; j < n; j++)\n        c++;', 'O(n²)'],
                ['int c = 0;\nfor (int i = 0; i < n; i++)\n    for (int j = 0; j < i; j++)\n        c++;', 'O(n²)'],
                ['int c = 0;\nfor (int i = 1; i < n; i *= 2)\n    c++;', 'O(log n)'],
                ['int c = 0;\nfor (int i = 0; i < n; i++)\n    for (int j = 1; j < n; j *= 2)\n        c++;', 'O(n log n)'],
                ['int c = 0;\nfor (int i = 0; i < n; i++)\n    for (int j = 0; j < n; j++)\n        for (int k = 0; k < n; k++)\n            c++;', 'O(n³)'],
                ['int c = 0;\nfor (int i = 0; i < n; i++)\n    for (int j = 0; j < 10; j++)\n        c++;', 'O(n)'],
                ['int c = 0;\nfor (int i = n; i > 1; i /= 2)\n    c++;', 'O(log n)'],
                ['int c = 0;\nfor (int i = 0; i < n; i++) c++;\nfor (int j = 0; j < n; j++) c++;', 'O(n)'],
                ['int c = 0;\nfor (int i = 0; i < 1000; i++)\n    c++;', 'O(1)']
            ];
            const [code, ans] = T[ri(r, 0, T.length - 1)];
            const pool = ['O(1)', 'O(log n)', 'O(n)', 'O(n log n)', 'O(n²)', 'O(n³)'];
            const m = mk(r, ans, shuffle(r, pool.filter(p => p !== ans)).slice(0, 3), () => pool[ri(r, 0, 5)]);
            return { topic: 'cx', q: 'Độ phức tạp thời gian (Big-O) của đoạn code sau?', code, opts: m.opts, correct: m.correct, exp: 'Đáp án: ' + ans };
        }
        function genHeap(r) {
            const vals = pickDistinct(r, 5, 1, 40);
            const h = [null]; const swim = (a, k, cmp) => { while (k > 1 && cmp(a[k >> 1], a[k])) { [a[k >> 1], a[k]] = [a[k], a[k >> 1]]; k >>= 1; } };
            for (const v of vals) { h.push(v); swim(h, h.length - 1, (p, c) => p < c); }
            const mn = [null]; for (const v of vals) { mn.push(v); swim(mn, mn.length - 1, (p, c) => p > c); }
            const good = h.slice(1), sw = good.slice();[sw[0], sw[sw.length - 1]] = [sw[sw.length - 1], sw[0]];
            const m = mk(r, '[' + L(good) + ']', ['[' + L(vals) + ']', '[' + L(vals.slice().sort((x, y) => y - x)) + ']', '[' + L(mn.slice(1)) + ']', '[' + L(sw) + ']'], () => '[' + L(shuffle(r, vals)) + ']');
            return { topic: 'pq', q: `Chèn lần lượt các khoá ${L(vals)} vào một max-heap rỗng (lưu mảng từ chỉ số 1, dùng swim). Mảng heap cuối cùng (từ chỉ số 1) là?`, code: '', opts: m.opts, correct: m.correct, exp: 'Mỗi khoá mới đặt ở cuối rồi swim lên trong khi lớn hơn cha (k/2).\nKết quả: [' + L(good) + ']' };
        }
        const GENERATORS = { cx: [genLoop], sort: [genSort, genInversions], stack: [genStack, genPostfix], queue: [genQueue], pq: [genHeap] };

        ES('sort', 'Mô tả các bước chạy Insertion Sort trên mảng [5, 2, 9, 1, 7]. Ghi mảng sau mỗi lượt.', 'i=1: [2,5,9,1,7]\ni=2: [2,5,9,1,7]\ni=3: [1,2,5,9,7]\ni=4: [1,2,5,7,9]');
        ES('sort', 'So sánh Selection Sort và Insertion Sort về: số phép so sánh, số lần hoán đổi, tính ổn định, và trường hợp tốt nhất.', 'Selection: ~n²/2 so sánh luôn, tối đa n hoán đổi, không ổn định, không có best case tốt hơn (luôn n²).\nInsertion: so sánh/hoán đổi phụ thuộc số nghịch thế, ổn định, best case O(n) với mảng đã sắp xếp.');
        ES('sort', 'Trình bày ý tưởng Mergesort, độ phức tạp thời gian và bộ nhớ phụ. Vì sao nó ổn định?', 'Chia đôi mảng, sort đệ quy từng nửa rồi trộn. T(n)=2T(n/2)+n → O(n log n); cần mảng phụ O(n).\nỔn định vì khi bằng nhau khi trộn ta lấy phần tử từ nửa trái trước.');
        ES('sort', 'Trình bày Quicksort: bước partition, trường hợp xấu nhất và cách phòng tránh.', 'Chọn pivot, partition sao cho trái ≤ pivot ≤ phải, rồi đệ quy hai phía. Trung bình ~1.39 n lg n.\nXấu nhất O(n²) khi pivot luôn cực trị (mảng đã sắp xếp). Phòng tránh: shuffle mảng ngẫu nhiên trước hoặc chọn pivot median-of-3.');
        ES('sort', 'Viết code Java của Insertion Sort và chứng minh độ phức tạp trường hợp xấu nhất.', 'for(int i=1;i<n;i++) for(int j=i;j>0&&a[j]<a[j-1];j--) swap(a,j,j-1);\nXấu nhất (mảng giảm dần): 1+2+…+(n−1) = n(n−1)/2 hoán đổi → O(n²).');
        ES('stack', 'Trình bày cách cài đặt Stack bằng mảng co giãn. Giải thích vì sao push có chi phí amortized O(1).', 'Mảng arr, biến size. Push: nếu đầy thì resize gấp đôi (copy O(n)), rồi arr[size++]=x. Pop: arr[--size].\nResize chỉ xảy ra ở các lần 1,2,4,8,… nên tổng chi phí n lần push ≤ 3n → O(1) trung bình.');
        ES('stack', 'Dùng stack để kiểm tra chuỗi ngoặc cân bằng. Mô tả thuật toán và chạy thử với "{[()]}" và "([)]".', 'Gặp ngoặc mở → push. Gặp ngoặc đóng → stack rỗng hoặc đỉnh không khớp thì sai; ngược lại pop. Cuối cùng stack phải rỗng.\n"{[()]}" → cân bằng. "([)]" → sai (gặp ) nhưng đỉnh là [).');
        ES('stack', 'Tính giá trị biểu thức postfix "5 1 2 + 4 * + 3 -" bằng stack, ghi trạng thái stack từng bước.', '5 → [5]; 1 → [5,1]; 2 → [5,1,2]; + → [5,3]; 4 → [5,3,4]; * → [5,12]; + → [17]; 3 → [17,3]; - → [14].\nKết quả: 14');
        ES('queue', 'So sánh Stack và Queue: nguyên tắc, thao tác chính, ứng dụng tiêu biểu.', 'Stack: LIFO (push/pop ở đỉnh) – undo, đệ quy, kiểm tra ngoặc, postfix.\nQueue: FIFO (enqueue ở cuối, dequeue ở đầu) – BFS, hàng đợi in, lập lịch tiến trình.');
        ES('queue', 'Mô tả circular array queue: cách lưu head/tail, kiểm tra đầy/rỗng và resize.', 'Mảng capacity C, head trỏ phần tử đầu, tail = (head+size)%C. Enqueue: arr[tail]=x; size++. Dequeue: x=arr[head]; head=(head+1)%C; size--.\nRỗng khi size=0, đầy khi size=C → resize gấp đôi và copy theo thứ tự từ head.');
        ES('queue', 'Cài đặt Queue bằng linked list với head và tail. Viết enqueue/dequeue và xử lý trường hợp đặc biệt.', 'enqueue: node mới; nếu rỗng head=tail=node, ngược lại tail.next=node; tail=node.\ndequeue: lấy head.item; head=head.next; nếu head==null thì tail=null (tránh trỏ treo). Cả hai O(1).');
        ES('pq', 'Giải thích swim và sink trong binary heap. Viết code Java.', 'swim(k): while(k>1 && less(k/2,k)){exch(k/2,k); k=k/2;}\nsink(k): while(2k<=n){ j=2k; if(j<n&&less(j,j+1)) j++; if(!less(k,j)) break; exch(k,j); k=j;}\nCả hai O(log n).');
        ES('pq', 'Chèn lần lượt 10, 4, 15, 20, 8, 30 vào max-heap rỗng. Vẽ/ghi mảng heap sau mỗi lần chèn.', '[10]\n[10,4]\n[15,4,10]\n[20,15,10,4]\n[20,15,10,4,8]\n[30,15,20,4,8,10]');
        ES('pq', 'Trình bày heap sort: các bước, độ phức tạp, ưu và nhược điểm.', 'B1: xây heap bottom-up bằng sink (O(n)). B2: lặp hoán đổi gốc với phần tử cuối, giảm kích thước, sink(1).\nO(n log n) mọi trường hợp, in-place. Nhược: không ổn định, cache kém.');

        function buildEssays(cfg) {
            const r = mulberry32(hashSeed(cfg.seed + '|essay|' + cfg.topics.join()));
            const pools = {}; cfg.topics.forEach(t => pools[t] = shuffle(r, ESSAYS.filter(e => e.topic === t)));
            const out = []; let guard = 0;
            while (out.length < cfg.ne && guard++ < 500) {
                const t = cfg.topics[out.length % cfg.topics.length];
                if (pools[t].length) out.push(pools[t].pop());
                else { const any = cfg.topics.find(x => pools[x].length); if (!any) break; out.push(pools[any].pop()); }
            }
            return out;
        }

        function buildExam(cfg) {
            const r = mulberry32(hashSeed(cfg.seed + '|' + cfg.topics.join() + '|' + cfg.n + '|' + cfg.pct));
            const pools = {}; cfg.topics.forEach(t => pools[t] = shuffle(r, BANK.filter(b => b.topic === t)));
            const qs = [];
            for (let i = 0; i < cfg.n; i++) {
                const t = cfg.topics[i % cfg.topics.length];
                let q;
                if (r() * 100 < cfg.pct || !pools[t].length) {
                    const g = GENERATORS[t]; q = g[ri(r, 0, g.length - 1)](r); q.gen = true;
                } else {
                    const b = pools[t].pop(); const order = shuffle(r, [0, 1, 2, 3]);
                    q = { ...b, opts: order.map(k => b.opts[k]), correct: order.indexOf(b.correct), gen: false };
                }
                qs.push(q);
            }
            return shuffle(r, qs);
        }

        /* =====================================================================
           UI
           ===================================================================== */
        const $ = id => document.getElementById(id);
        const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
        let state = null, timerId = null;

        function newSeed() { return String(Math.floor(100000 + Math.random() * 900000)); }
        $('seed').value = newSeed();
        $('genPct').oninput = e => $('genPctV').textContent = e.target.value;
        $('rollBtn').onclick = () => $('seed').value = newSeed();
        Object.entries(TOPICS).forEach(([k, v]) => {
            const l = el('label', 'topic'); const c = el('input'); c.type = 'checkbox'; c.value = k; c.checked = true;
            const d = el('div'); d.append(el('span', '', v.name)); d.append(el('small', '', v.desc)); l.append(c, d); $('topicList').append(l);
        });

        function readCfg() {
            const topics = [...document.querySelectorAll('#topicList input:checked')].map(i => i.value);
            if (!topics.length) { alert('Chọn ít nhất 1 chủ đề.'); return null; }
            return { topics, n: Math.min(100, Math.max(0, Math.floor(+$('numQ').value) || 0)), ne: Math.min(30, Math.max(0, Math.floor(+$('numE').value) || 0)), mins: Math.max(0, +$('mins').value || 0), seed: $('seed').value.trim() || newSeed(), pct: +$('genPct').value };
        }
        function start(cfg) {
            state = { cfg, qs: cfg.n ? buildExam(cfg) : [], es: buildEssays(cfg), ans: [], done: false, left: cfg.mins * 60 };
            $('setup').classList.add('hidden'); $('history').classList.add('hidden'); $('exam').classList.remove('hidden');
            $('examCode').textContent = 'Mã đề: ' + cfg.seed; $('resultBox').replaceChildren(); $('afterActions').classList.add('hidden');
            $('submitBtn').classList.remove('hidden'); $('saveBtn').classList.remove('hidden'); $('saveTopBtn').classList.add('hidden'); $('saveTopBtn').textContent = $('saveBtn').textContent = '💾 Lưu kết quả'; $('qList').classList.remove('exam-done');
            render(); clearInterval(timerId); tick();
            if (cfg.mins) timerId = setInterval(tick, 1000); else $('timer').textContent = '∞';
            window.scrollTo(0, 0);
        }
        function tick() {
            if (!state.cfg.mins) return;
            const m = Math.floor(state.left / 60), s = state.left % 60;
            $('timer').textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
            $('timer').classList.toggle('low', state.left <= 60);
            if (state.left-- <= 0) submit();
        }
        function render() {
            const list = $('qList'), nav = $('nav'); list.replaceChildren(); nav.replaceChildren();
            state.qs.forEach((q, i) => {
                const card = el('article', 'card q'); card.id = 'q' + i;
                const h = el('div', 'qh'); h.append(el('span', 'qn', 'Câu ' + (i + 1)), el('span', 'tag', TOPICS[q.topic].name));
                if (q.gen) h.append(el('span', 'tag gen', 'sinh tự động')); card.append(h, el('div', 'qt', q.q));
                if (q.code) card.append(el('pre', '', q.code));
                q.opts.forEach((o, k) => {
                    const d = el('div', 'opt'); d.dataset.k = k; d.append(el('b', '', 'ABCD'[k]), el('span', '', o));
                    d.onclick = () => { if (state.done) return; state.ans[i] = k; refresh(); }; card.append(d);
                });
                list.append(card);
                const a = el('a', '', i + 1); a.href = '#q' + i; nav.append(a);
            });
            if (state.es.length) {
                const t = el('h2', '', 'Phần tự luận'); t.style.cssText = 'margin:26px 0 14px;color:#fcd34d'; list.append(t);
                state.es.forEach((e, i) => {
                    const card = el('article', 'card q'); card.id = 'e' + i;
                    const h = el('div', 'qh'); h.append(el('span', 'qn', 'Tự luận ' + (i + 1)), el('span', 'tag', TOPICS[e.topic].name)); card.append(h, el('div', 'qt', e.q));
                    if (e.code) card.append(el('pre', '', e.code));
                    const ta = el('textarea'); ta.placeholder = 'Nhập câu trả lời…'; ta.id = 'ta' + i; card.append(ta); list.append(card);
                    const a = el('a', 'essay', 'TL' + (i + 1)); a.href = '#e' + i; nav.append(a);
                });
            }
            refresh();
        }
        function refresh() {
            state.qs.forEach((q, i) => {
                const card = $('q' + i), a = $('nav').children[i];
                card.querySelectorAll('.opt').forEach((d, k) => {
                    d.classList.toggle('sel', !state.done && state.ans[i] === k);
                    if (state.done) { d.classList.toggle('c', k === q.correct); d.classList.toggle('w', k === state.ans[i] && k !== q.correct); }
                });
                if (state.done) { const ok = state.ans[i] === q.correct; card.classList.toggle('right', ok); card.classList.toggle('wrong', !ok); a.className = ok ? 'right' : 'wrong'; }
                else a.className = state.ans[i] != null ? 'done' : '';
            });
            $('progress').textContent = 'Đã làm ' + state.ans.filter(x => x != null).length + '/' + state.qs.length;
        }
        function submit() {
            if (state.done) return; clearInterval(timerId); state.done = true;
            const right = state.qs.filter((q, i) => state.ans[i] === q.correct).length, n = state.qs.length;
            const box = el('div', 'card score');
            if (n) box.append(el('div', 'big', (right / n * 10).toFixed(1) + ' / 10'), el('div', '', `Trắc nghiệm đúng ${right}/${n} câu · Mã đề ${state.cfg.seed}`));
            else box.append(el('div', 'big', 'Tự luận'), el('div', '', 'Mã đề ' + state.cfg.seed));
            if (state.es.length) box.append(el('div', '', `Phần tự luận (${state.es.length} câu): so với đáp án tham khảo bên dưới và tự chấm.`));
            $('resultBox').replaceChildren(box);
            state.es.forEach((e, i) => { $('ta' + i).readOnly = true; $('e' + i).append(el('div', 'ref', '✅ Đáp án tham khảo:\n' + e.ans)); });
            state.qs.forEach((q, i) => { if (q.exp) $('q' + i).append(el('div', 'exp', '💡 ' + q.exp)); });
            $('qList').classList.add('exam-done'); $('submitBtn').classList.add('hidden'); $('saveTopBtn').classList.remove('hidden'); $('afterActions').classList.remove('hidden');
            refresh(); window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        /* ---- Lưu lịch sử vào localStorage (còn sau khi tắt trình duyệt) ---- */
        const HKEY = 'dsa-exam-history';
        const loadH = () => { try { return JSON.parse(localStorage.getItem(HKEY)) || []; } catch (e) { return []; } };
        const storeH = h => localStorage.setItem(HKEY, JSON.stringify(h));
        function saveResult() {
            if (!state || !state.done) return;
            if (state.saved) { alert('Kết quả này đã được lưu.'); return; }
            const byTopic = {}; state.qs.forEach((q, i) => { const b = byTopic[q.topic] || (byTopic[q.topic] = [0, 0]); b[1]++; if (state.ans[i] === q.correct) b[0]++; });
            const right = state.qs.filter((q, i) => state.ans[i] === q.correct).length;
            const rec = {
                id: Date.now(), at: new Date().toISOString(), cfg: state.cfg, right, total: state.qs.length,
                score: state.qs.length ? +(right / state.qs.length * 10).toFixed(2) : null, byTopic,
                qs: state.qs, ans: state.qs.map((_, i) => state.ans[i] == null ? null : state.ans[i]),
                essays: state.es.map((e, i) => ({ topic: e.topic, q: e.q, code: e.code, ref: e.ans, answer: $('ta' + i).value }))
            };
            try { const h = loadH(); h.unshift(rec); storeH(h); } catch (e) { alert('Không lưu được: ' + e.message); return; }
            state.saved = true; $('saveBtn').textContent = $('saveTopBtn').textContent = '✓ Đã lưu'; renderHistory();
        }
        function renderHistory() {
            const box = $('historyList'), h = loadH(); box.replaceChildren();
            if (!h.length) { box.append(el('p', 'sub', 'Chưa có kết quả nào được lưu.')); return; }
            h.forEach(rec => {
                const row = el('div', 'opt'); row.style.cursor = 'default'; row.style.justifyContent = 'space-between'; row.style.alignItems = 'center';
                const info = el('div');
                const sc = rec.score == null ? 'Chỉ tự luận' : rec.score + '/10 (' + rec.right + '/' + rec.total + ')';
                info.append(el('b', '', sc), el('div', '', new Date(rec.at).toLocaleString('vi-VN') + ' · Mã ' + rec.cfg.seed + ' · TL: ' + rec.essays.length + ' câu'));
                const tp = Object.entries(rec.byTopic).map(([t, v]) => TOPICS[t].name + ' ' + v[0] + '/' + v[1]).join(' | ');
                const s = el('small', '', tp); s.style.color = 'var(--muted)'; info.append(s);
                const btns = el('div'); btns.style.cssText = 'display:flex;gap:8px';
                const view = el('button', '', '👁 Xem lại'); view.style.padding = '6px 12px'; if (rec.qs) view.onclick = () => review(rec); else { view.disabled = true; view.title = 'Bản ghi cũ, không có dữ liệu chi tiết'; view.style.opacity = .4; }
                const re = el('button', 'sec', '↻ Làm lại'); re.style.padding = '6px 12px'; re.onclick = () => start(rec.cfg);
                const del = el('button', 'sec', '✕'); del.style.padding = '6px 12px'; del.onclick = () => { storeH(loadH().filter(x => x.id !== rec.id)); renderHistory(); };
                btns.append(view, re, del); row.append(info, btns); box.append(row);
            });
        }
        function review(rec) {
            clearInterval(timerId);
            state = { cfg: rec.cfg, qs: rec.qs, es: rec.essays.map(e => ({ topic: e.topic, q: e.q, code: e.code, ans: e.ref })), ans: rec.ans, done: true, saved: true, left: 0 };
            $('setup').classList.add('hidden'); $('history').classList.add('hidden'); $('exam').classList.remove('hidden');
            $('examCode').textContent = 'Xem lại · Mã ' + rec.cfg.seed + ' · ' + new Date(rec.at).toLocaleString('vi-VN');
            const box = el('div', 'card score');
            box.append(el('div', 'big', rec.score == null ? 'Tự luận' : rec.score + ' / 10'), el('div', '', rec.score == null ? '' : `Trắc nghiệm đúng ${rec.right}/${rec.total} câu`));
            $('resultBox').replaceChildren(box);
            render();
            state.es.forEach((e, i) => { const ta = $('ta' + i); ta.value = rec.essays[i].answer; ta.readOnly = true; $('e' + i).append(el('div', 'ref', '✅ Đáp án tham khảo:\n' + e.ans)); });
            state.qs.forEach((q, i) => { if (q.exp) $('q' + i).append(el('div', 'exp', '💡 ' + q.exp)); });
            $('qList').classList.add('exam-done'); $('timer').textContent = '👁'; $('timer').classList.remove('low');
            ['submitBtn', 'saveTopBtn', 'saveBtn'].forEach(id => $(id).classList.add('hidden')); $('afterActions').classList.remove('hidden');
            refresh(); window.scrollTo(0, 0);
        }
        $('saveBtn').onclick = $('saveTopBtn').onclick = saveResult;
        $('exportBtn').onclick = () => {
            const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(loadH(), null, 2)], { type: 'application/json' }));
            a.download = 'dsa-exam-history.json'; a.click(); URL.revokeObjectURL(a.href);
        };
        $('clearBtn').onclick = () => { if (confirm('Xoá toàn bộ lịch sử?')) { storeH([]); renderHistory(); } };
        renderHistory();
        $('startBtn').onclick = () => { const c = readCfg(); if (c) start(c); };
        $('submitBtn').onclick = () => submit();
        $('printBtn').onclick = () => window.print();
        $('newBtn').onclick = () => { const c = { ...state.cfg, seed: newSeed() }; $('seed').value = c.seed; start(c); };
        $('retryBtn').onclick = () => start(state.cfg);
        $('homeBtn').onclick = () => { if (!state.done && !confirm('Bài đang làm sẽ không được lưu. Quay về trang chính?')) return; $('backBtn').onclick(); };
        $('backBtn').onclick = () => { clearInterval(timerId); $('exam').classList.add('hidden'); $('setup').classList.remove('hidden'); $('history').classList.remove('hidden'); renderHistory(); };
    </script>
</body>
